# Proposes updates to the pinned actions and the Go modules once a week. Each one arrives as a pull request
# and runs the full CI; review the release notes and the new commit before merging. Actions stay pinned to a
# full commit SHA, with the version in a comment, which Dependabot keeps in step.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
