name: ci

on:
  push:
  pull_request:
  # The heavy store tests run here, once a night and only if main changed. They can also be started by hand.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  # Bump together with the Go toolchain; Dependabot does not see versions inside run steps.
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Format, vet and the five cross-builds share one runner: each is a few seconds of work, while every extra job
  # costs its own start-up, checkout and Go setup. Each target is its own step, so a failure names it, and every
  # step runs even after an earlier one failed.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            for f in $files; do echo "::error file=$f::not gofmt-formatted"; done
            exit 1
          fi
      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      # go.sum pins what is downloaded; this checks that the module cache still matches it.
      - name: go mod verify
        if: ${{ !cancelled() }}
        run: go mod verify
      # modernc.org/sqlite is generated against one libc version; a bump that moves libc alone breaks it at run time.
      - name: modernc libc matches the driver
        if: ${{ !cancelled() }}
        run: |
          want=$(go mod graph | awk '$1 ~ /^modernc[.]org[/]sqlite@/ && $2 ~ /^modernc[.]org[/]libc@/ {print $2; exit}')
          have="modernc.org/libc@$(go list -m -f '{{.Version}}' modernc.org/libc)"
          echo "driver wants $want, build uses $have"
          [ -n "$want" ] && [ "$want" = "$have" ]
      # Fails only on a vulnerability that the code can reach. Ones in unused parts of a dependency or of the
      # standard library are listed in the log but do not fail the run.
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      # The unit tests check the mode bits; this checks that the OS really keeps another user out. /tmp is
      # sticky and world-readable, so a denial comes from the data directory itself.
      - name: data directory denied to other users
        if: ${{ !cancelled() }}
        run: |
          go build -o "$RUNNER_TEMP/whatsapp-mcp" ./cmd/whatsapp-mcp
          go build -o "$RUNNER_TEMP/seed" ./internal/store/testdata/cmd/seed
          # status is offline and creates nothing, so the directory is made private first (mktemp -d is 0700)
          # and filled with synthetic data by the offline seed helper; no WhatsApp account is involved.
          dir=$(mktemp -d /tmp/whatsapp-mcp-data.XXXXXX)
          "$RUNNER_TEMP/seed" -dir "$dir" -n 10
          "$RUNNER_TEMP/whatsapp-mcp" status --data-dir "$dir"
          echo 'log_level = "info"' > "$dir/config.toml"
          ls -ld "$dir"
          if sudo -u nobody ls "$dir" >/dev/null 2>&1; then echo "::error::nobody can list $dir"; exit 1; fi
          if sudo -u nobody cat "$dir/config.toml" >/dev/null 2>&1; then echo "::error::nobody can read config.toml"; exit 1; fi
          sudo -u nobody ls /tmp >/dev/null
      - name: build windows/amd64
        if: ${{ !cancelled() }}
        env: { GOOS: windows, GOARCH: amd64 }
        run: go vet ./... && go build -o /dev/null ./cmd/whatsapp-mcp
      - name: build linux/amd64
        if: ${{ !cancelled() }}
        env: { GOOS: linux, GOARCH: amd64 }
        run: go vet ./... && go build -o /dev/null ./cmd/whatsapp-mcp
      - name: build linux/arm64
        if: ${{ !cancelled() }}
        env: { GOOS: linux, GOARCH: arm64 }
        run: go vet ./... && go build -o /dev/null ./cmd/whatsapp-mcp
      - name: build darwin/amd64
        if: ${{ !cancelled() }}
        env: { GOOS: darwin, GOARCH: amd64 }
        run: go vet ./... && go build -o /dev/null ./cmd/whatsapp-mcp
      - name: build darwin/arm64
        if: ${{ !cancelled() }}
        env: { GOOS: darwin, GOARCH: arm64 }
        run: go vet ./... && go build -o /dev/null ./cmd/whatsapp-mcp

  # The lock, signal handling, file access checks and the store's read-only database view differ per OS, so
  # every push and pull request is tested on all three. A feature's platform gates have to pass on a branch,
  # before its pull request exists.
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Windows runner keeps its temporary directory on the C: drive, which is about 12 times slower than the D:
      # drive that holds the workspace: TestQueryPlans took 493 s there and 39 s with the directory on D:. The store's
      # tests write databases of hundreds of thousands of messages, so they use D:.
      - name: temporary directory on the workspace drive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p 'D:\wa-tmp'
          echo 'TEMP=D:\wa-tmp' >> "$GITHUB_ENV"
          echo 'TMP=D:\wa-tmp' >> "$GITHUB_ENV"
      # The store's tests include concurrency and crash tests; the default 10 min is too tight for the slowest runner (Windows needs more than 15 min for the limit and memory tests).
      - run: go test -timeout 30m ./...
      - name: Native message tool acceptance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD) date=$(date -u +%FT%TZ) native=$(go env GOOS GOARCH | xargs)"
          results="$RUNNER_TEMP/message-acceptance.log"
          status=0
          go test -count=1 -timeout 5m -v ./internal/store ./internal/mcp ./cmd/whatsapp-mcp -run '^Test(MCPMessage|ToolMessage)' > "$results" || status=$?
          cat "$results"
          echo "go_test_exit=$status"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          for name in TestToolMessageLifecycleActualWALDrain TestMCPMessageAcceptanceScale TestMCPMessageBudgetContinuation TestMCPMessageStdioNative; do
            grep -q "^--- PASS: $name (" "$results" || { echo "::error::missing passing native evidence for $name"; exit 1; }
          done
      - name: Profile failed macOS message acceptance
        if: ${{ failure() && runner.os == 'macOS' }}
        shell: bash
        run: |
          profile="$RUNNER_TEMP/message-search.cpu"
          binary="$RUNNER_TEMP/message-search.test"
          status=0
          go test -count=1 -v -timeout 5m -cpuprofile "$profile" -o "$binary" ./internal/mcp -run '^TestMCPMessageAcceptanceScale$' || status=$?
          echo "profiled_test_exit=$status"
          if [[ -s "$profile" ]]; then
            go tool pprof -top -cum -focus=searchMessageBatch -nodecount=45 "$binary" "$profile"
          fi
      - name: Native stdio diagnostic shutdown evidence
        if: ${{ !cancelled() && (runner.os == 'Linux' || runner.os == 'macOS') }}
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          echo "commit=$(git rev-parse HEAD) date=$(date -u +%FT%TZ) native=$(uname -sm) go=$(go env GOOS GOARCH | xargs)"
          status=0
          go test -count=1 -json -timeout 3m -run '^TestMCPDiagnosticShutdownNative$' ./cmd/whatsapp-mcp > "$RUNNER_TEMP/diagnostics.jsonl" || status=$?
          echo "go_test_exit=$status"
          jq -r 'select((.Test // "") | startswith("TestMCPDiagnosticShutdownNative")) | select(.Action == "output") | .Output' "$RUNNER_TEMP/diagnostics.jsonl"
          jq -s 'reduce (.[] | select(.Test)) as $e ({pass: 0, fail: 0, skip: 0}; if has($e.Action) then .[$e.Action] += 1 else . end)' "$RUNNER_TEMP/diagnostics.jsonl"
          for case in blocked_startup blocked_operation blocked_drain closed_stderr first_signal forced_second_signal; do
            jq -es --arg name "TestMCPDiagnosticShutdownNative/$case" '
              any(.[]; .Test == $name and .Action == "pass") and
              any(.[]; .Test == $name and .Action == "output" and (.Output | contains("child_exit=1 expected_exit=1"))) and
              (all(.[]; .Test != $name or (.Action != "skip" and .Action != "fail")))
            ' "$RUNNER_TEMP/diagnostics.jsonl" >/dev/null || { echo "::error::missing passing native evidence for $case"; exit 1; }
          done
          jq -es 'any(.[]; .Test == "TestMCPDiagnosticShutdownNative/forced_second_signal" and .Action == "output" and (.Output | contains("forced_callback=true")))' "$RUNNER_TEMP/diagnostics.jsonl" >/dev/null
          exit "$status"
      - name: Native integrated MCP pipe evidence
        if: ${{ !cancelled() && (runner.os == 'Linux' || runner.os == 'macOS') }}
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD) date=$(date -u +%FT%TZ) native=$(uname -sm) go=$(go env GOOS GOARCH | xargs)"
          results="$RUNNER_TEMP/mcp-pipes.jsonl"
          status=0
          go test -count=2 -json -timeout 8m -run '^Test(MCPPipe(Native|Unix)|MCPHarnessHeldOwnerAndCooperativeStreams|MCPStdioIntegratedDrain)$' ./cmd/whatsapp-mcp > "$results" || status=$?
          echo "go_test_exit=$status"
          jq -r 'select(.Action == "output") | .Output' "$results"
          jq -s 'reduce (.[] | select(.Test)) as $e ({pass: 0, fail: 0, skip: 0}; if has($e.Action) then .[$e.Action] += 1 else . end)' "$results"
          for case in Native/{first_signal,partial_stdin_eof,partial_stdin_timeout,slow_stdout,blocked_stdout,all_blocked_stdout,closed_stdout,client_cancel,stderr_blocked_startup,stderr_blocked_operation,stderr_blocked_drain,stderr_blocked_overflow,stderr_closed} Unix/{stderr_closed_startup,stderr_closed_ordinary,device_fault_eof,forced_second_signal}; do
            jq -es --arg name "TestMCPPipe$case" '
              (map(select(.Test == $name and .Action == "pass")) | length == 2) and
              (map(select(.Test == $name and .Action == "output" and (.Output | test("child_exit=[01] expected_exit=[01] normal_cleanup=true")))) | length == 2)
            ' "$results" >/dev/null || { echo "::error::missing repeated native evidence for $case"; exit 1; }
          done
          jq -es '
            all(.[]; .Action != "skip" and .Action != "fail") and
            (map(select(.Test == "TestMCPPipeUnix/forced_second_signal" and .Action == "output" and (.Output | contains("forced_callback=true")))) | length == 2) and
            (map(select(.Test == "TestMCPHarnessHeldOwnerAndCooperativeStreams" and .Action == "pass")) | length == 2) and
            (map(select(.Test == "TestMCPStdioIntegratedDrain" and .Action == "pass")) | length == 2)
          ' "$results" >/dev/null
          exit "$status"
      # Which unsafe-run, recovery and terminal tests ran or skipped on this OS: the plain run above prints only
      # package results. The summary is the evidence that the platform gates were exercised, not just compiled.
      - name: unsafe-run platform tests (verbose summary)
        shell: bash
        run: |
          go test -timeout 30m -count=1 -v -run 'RunGuard|Recovery|Recover|Terminal' ./internal/store ./internal/wa ./cmd/whatsapp-mcp > run-guard.log 2>&1 || { tail -n 80 run-guard.log; exit 1; }
          grep -E '^\s*--- (PASS|SKIP|FAIL)' run-guard.log | sed -E 's/ \([0-9.]+s\)//' | sort | uniq -c | sort -rn | head -150
          echo "passed: $(grep -cE '^\s*--- PASS' run-guard.log)  skipped: $(grep -cE '^\s*--- SKIP' run-guard.log)  failed: $(grep -cE '^\s*--- FAIL' run-guard.log)"
          grep -E '^\s*--- SKIP' -B2 run-guard.log | grep -vE '^--$' | head -60 || true

  # Temporary, for feature 007: repeated native macOS acceptance evidence on the final code. The arm64 runners are
  # the evidence; the Intel runners show whether the guaranteed size also holds there.
  macos-repeat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/007-mcp-message-tools'
    name: repeat (${{ matrix.runner }}, machine ${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-26-intel, macos-15-intel]
        machine: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: runner facts
        run: echo "commit=$(git rev-parse HEAD) date=$(date -u +%FT%TZ) runner=${{ matrix.runner }} image=${ImageOS:-} ${ImageVersion:-} native=$(go env GOOS GOARCH | xargs) cpus=$(sysctl -n hw.ncpu) memory=$(sysctl -n hw.memsize)"
      - name: full tests
        run: go test ./... -count=1 -timeout 30m
      - name: message tool acceptance, three runs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failures=0
          for attempt in 1 2 3; do
            results="$RUNNER_TEMP/acceptance-$attempt.log"
            status=0
            go test -count=1 -timeout 5m -v ./internal/store ./internal/mcp ./cmd/whatsapp-mcp -run '^Test(MCPMessage|ToolMessage)' > "$results" || status=$?
            cat "$results"
            echo "attempt=$attempt go_test_exit=$status top_pass=$(grep -c '^--- PASS: ' "$results" || true) sub_pass=$(grep -cE '^ +--- PASS: ' "$results" || true) top_fail=$(grep -c '^--- FAIL: ' "$results" || true) sub_fail=$(grep -cE '^ +--- FAIL: ' "$results" || true) skip=$(grep -cE -e '--- SKIP: ' "$results" || true)"
            if [[ "$status" -ne 0 ]]; then failures=$((failures + 1)); fi
          done
          echo "failed_attempts=$failures"
          [[ "$failures" -eq 0 ]]
      - name: native cancellation, fifty runs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          results="$RUNNER_TEMP/cancel.log"
          status=0
          go test -count=50 -timeout 10m -v ./cmd/whatsapp-mcp -run '^TestMCPMessageStdioNative$/^cancel$' > "$results" || status=$?
          grep -E -e '--- FAIL|exit=|^(ok|FAIL)' "$results" || true
          echo "cancel go_test_exit=$status passes=$(grep -cE '^ +--- PASS: TestMCPMessageStdioNative/cancel ' "$results" || true) failures=$(grep -cE '^ +--- FAIL: TestMCPMessageStdioNative/cancel ' "$results" || true)"
          exit "$status"

  # The tests that take minutes on a slow disk: a 500 MiB listing and a 400,000-message memory check. They show that
  # a limit holds and are not needed on every push, so they run on Linux only, at night, and only if main has a
  # commit from the last 25 hours. Start the job by hand to run them on any branch.
  heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: heavy store tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: changed since yesterday?
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -z "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main has no commit from the last 25 hours; nothing to run"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: heavy store tests
        if: steps.changed.outputs.run == 'true'
        env:
          WA_HEAVY_TESTS: "1"
        run: go test -timeout 30m -count=1 -run 'TestHeavyContactListing|TestPerContactMemory' -v ./internal/store
